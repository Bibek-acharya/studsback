version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studsphere_db
    environment:
      POSTGRES_USER: studsphere_user
      POSTGRES_PASSWORD: studsphere_pass
      POSTGRES_DB: studsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studsphere_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: studsphere_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 3
        ollama pull nomic-embed-text
        wait

volumes:
  postgres_data:
  ollama_data:
