services:
  ollama:
    image: ollama/ollama:latest
    container_name: studsphere_ollama_embeddings
    ports:
      - "11434:11434"
    volumes:
      - ollama_embeddings_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do
          echo "Waiting for Ollama..."
          sleep 2
        done
        echo "Pulling nomic-embed-text..."
        until ollama pull nomic-embed-text; do
          echo "Model pull failed, retrying in 5s..."
          sleep 5
        done
        echo "Embedding model ready"
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: studsphere_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: studsphere_nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--jetstream", "--store_dir", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: studsphere_meilisearch
    volumes:
      - meilisearch_data:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme}
      MEILI_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studsphere_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MEILI_HOST: http://meilisearch:7700
      # Ollama is used only for embeddings; chat remains OpenRouter-based.
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      EMBEDDING_API_KEY: ollama-local
      EMBEDDING_MODEL: nomic-embed-text
      VECTOR_DIMENSION: 768
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_embeddings_data:
  redis_data:
  nats_data:
  meilisearch_data:
