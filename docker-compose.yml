services:
  ollama:
    image: ollama/ollama:latest
    container_name: studsphere_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        # Wait for ollama server to be ready
        until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do
          echo "Waiting for ollama server..."
          sleep 2
        done
        echo "Server ready, pulling nomic-embed-text..."
        until ollama pull nomic-embed-text; do
          echo "Pull failed, retrying in 5s..."
          sleep 5
        done
        echo "Model pulled successfully"
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  ollama-llm:
    image: ollama/ollama:latest
    container_name: studsphere_ollama_llm
    ports:
      - "11435:11434"
    volumes:
      - ollama_llm_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until curl -s http://localhost:11434/api/tags > /dev/null 2>&1; do
          echo "Waiting for ollama-llm server..."
          sleep 2
        done
        echo "Server ready, pulling llama3.1:8b..."
        until ollama pull llama3.1:8b; do
          echo "Pull failed, retrying in 5s..."
          sleep 5
        done
        echo "Model pulled successfully"
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q llama3.1:8b"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studsphere_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      EMBEDDING_BASE_URL: http://ollama:11434/v1
      LLM_BASE_URL: http://ollama-llm:11434/v1
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      ollama:
        condition: service_healthy
      ollama-llm:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
  ollama_llm_data:
