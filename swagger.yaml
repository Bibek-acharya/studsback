        - preferences
      properties:
        preference_role:
          type: string
        preference_flow:
          type: string
          enum: [flowA, flowB, flowFresher, flowExperienced]
        preferences:
          type: object
          description: Key-value pairs of preferences

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    User:
