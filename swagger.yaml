components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login or registration endpoint

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [student, job_seeker, teacher, admin]
          default: student
        education_level:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    InstitutionRegisterRequest:
      type: object
      required:
        - institution_name
        - registration_number
        - email
        - password
      properties:
        institution_name:
          type: string
        registration_number:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    InstitutionLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ScholarshipProviderRegisterRequest:
      type: object
      required:
        - provider_name
        - registration_number
        - email
        - password
      properties:
        provider_name:
          type: string
        registration_number:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    ScholarshipProviderLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SavePreferencesRequest:
      type: object
      required:
        - preference_role
