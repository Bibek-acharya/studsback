openapi: 3.0.3
info:
  title: StudSphere API
  description: API for the StudSphere education platform - connecting students with universities, colleges, scholarships, and community forums.
  version: 1.0.0
  contact:
    name: StudSphere Team
servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.studsphere.com
    description: Production server

tags:
  - name: Health
    description: Health check endpoints
  - name: Authentication
    description: User authentication and registration
  - name: Institution Authentication
    description: Institution authentication and registration
  - name: Scholarship Provider Authentication
    description: Scholarship provider authentication and registration
  - name: Colleges
    description: College management and browsing
  - name: Universities
    description: University management and browsing
  - name: Education
    description: Education resources (exams, courses, scholarships, news, events)
  - name: Scholarships
    description: Scholarship browsing and applications
  - name: Tools
    description: AI-powered recommendation tools
  - name: Forum
    description: Community forum posts and interactions
  - name: Forum Communities
    description: Forum community management
  - name: Profile
    description: User profile management
  - name: Counselling
    description: Counselling booking management
  - name: Admissions
    description: Admission application management for students
  - name: Admin Admissions
    description: Admin admission management and review
  - name: Institution
    description: Institution (college/university) management endpoints
  - name: Scholarship Provider
    description: Scholarship provider management endpoints
  - name: Admin Scholarships
    description: Admin scholarship and application management
  - name: Admin
    description: Administrative operations

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the server is running
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Server is running

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/send-otp:
    post:
      tags:
        - Authentication
      summary: Send OTP
      description: Send a one-time password to the user's email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: OTP sent successfully
        '400':
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/verify-otp:
    post:
      tags:
        - Authentication
      summary: Verify OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        '200':
          description: OTP verified successfully
        '400':
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/google:
    get:
      tags:
        - Authentication
      summary: Initiate Google OAuth login
      description: Redirects to Google OAuth consent screen
      responses:
        '302':
          description: Redirect to Google OAuth

  /api/v1/auth/google/callback:
    get:
      tags:
        - Authentication
      summary: Google OAuth callback
      description: Handles the callback from Google OAuth
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/institutions/auth/register:
    post:
      tags:
        - Institution Authentication
      summary: Register a new institution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionRegisterRequest'
      responses:
        '200':
          description: Institution registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/institutions/auth/login:
    post:
      tags:
        - Institution Authentication
      summary: Login institution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/scholarship-providers/auth/register:
    post:
      tags:
        - Scholarship Provider Authentication
      summary: Register a new scholarship provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScholarshipProviderRegisterRequest'
      responses:
        '200':
          description: Scholarship provider registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/scholarship-providers/auth/login:
    post:
      tags:
        - Scholarship Provider Authentication
      summary: Login scholarship provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScholarshipProviderLoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/colleges:
    get:
      tags:
        - Colleges
      summary: Get all colleges
      description: Retrieve a list of all colleges with optional filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of colleges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeListResponse'
    post:
      tags:
        - Admin
      summary: Create a new college
      description: Admin only - Create a new college
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollegeRequest'
      responses:
        '201':
          description: College created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/colleges/{id}:
    get:
      tags:
        - Colleges
      summary: Get college by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: College details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeResponse'
        '404':
          description: College not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Admin
      summary: Update a college
      description: Admin only - Update college details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollegeRequest'
      responses:
        '200':
          description: College updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollegeResponse'
        '404':
          description: College not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Admin
      summary: Delete a college
      description: Admin only - Delete a college
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: College deleted successfully
        '404':
          description: College not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/universities:
    get:
      tags:
        - Universities
      summary: Get all universities
      description: Retrieve a list of all universities
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of universities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityListResponse'
    post:
      tags:
        - Admin
      summary: Create a new university
      description: Admin only - Create a new university
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUniversityRequest'
      responses:
        '201':
          description: University created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/universities/{id}:
    get:
      tags:
        - Universities
      summary: Get university by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: University details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityResponse'
        '404':
          description: University not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Admin
      summary: Update a university
      description: Admin only - Update university details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUniversityRequest'
      responses:
        '200':
          description: University updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityResponse'
        '404':
          description: University not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Admin
      summary: Delete a university
      description: Admin only - Delete a university
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: University deleted successfully
        '404':
          description: University not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/universities/{id}/{tab}:
    get:
      tags:
        - Universities
      summary: Get university tab data
      description: Get specific tab data for a university (e.g., about, courses, admissions)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: tab
          in: path
          required: true
          schema:
            type: string
            enum: [about, courses, admissions, scholarships, events, news, downloads, gallery, faculties, reviews, programs, leadership, contact, overview]
      responses:
        '200':
          description: Tab data retrieved successfully
        '404':
          description: University or tab not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/education/rankings:
    get:
      tags:
        - Education
      summary: Get education rankings
      responses:
        '200':
          description: Education rankings
          content:
            application/json:
              schema:
                type: object

  /api/v1/education/exams:
    get:
      tags:
        - Education
      summary: Get all exams
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of exams
          content:
            application/json:
              schema:
                type: object

  /api/v1/education/exams/{id}:
    get:
      tags:
        - Education
      summary: Get exam by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Exam details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exam'
        '404':
          description: Exam not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/education/scholarships:
    get:
      tags:
        - Scholarships
      summary: Get all scholarships
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: degree_level
          in: query
          schema:
            type: string
        - name: funding_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of scholarships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarshipListResponse'

  /api/v1/education/scholarships/{id}:
    get:
      tags:
        - Scholarships
      summary: Get scholarship by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Scholarship details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarshipResponse'
        '404':
          description: Scholarship not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/education/scholarships/{id}/similar:
    get:
      tags:
        - Scholarships
      summary: Get similar scholarships
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of similar scholarships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scholarship'

  /api/v1/education/scholarships/{id}/apply:
    post:
      tags:
        - Scholarships
      summary: Apply for a scholarship
      description: Submit a scholarship application (requires authentication)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScholarshipApplicationRequest'
      responses:
        '201':
          description: Application submitted successfully
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/education/courses:
    get:
      tags:
        - Education
      summary: Get all courses
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: object

  /api/v1/education/courses/{id}:
    get:
      tags:
        - Education
      summary: Get course by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/education/courses/{id}/details:
    get:
      tags:
        - Education
      summary: Get course details by ID
      description: Get detailed information about a course
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detailed course information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/education/admissions:
    get:
      tags:
        - Education
      summary: Get admissions information
      responses:
        '200':
          description: Admissions information
          content:
            application/json:
              schema:
                type: object

  /api/v1/education/news:
    get:
      tags:
        - Education
      summary: Get education news
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of news articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/News'

  /api/v1/education/events:
    get:
      tags:
        - Education
      summary: Get education events
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /api/v1/tools/scholarship-finder/recommendations:
    post:
      tags:
        - Tools
      summary: Get scholarship recommendations
      description: AI-powered scholarship recommendations based on user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScholarshipFinderRequest'
      responses:
        '200':
          description: Scholarship recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Scholarship'
                  confidence_scores:
                    type: array
                    items:
                      type: number
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/tools/college-recommender/recommendations:
    post:
      tags:
        - Tools
      summary: Get college recommendations
      description: AI-powered college recommendations based on user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollegeRecommenderRequest'
      responses:
        '200':
          description: College recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  recommendations:
                    type: array
                    items:
                      $ref: '#/components/schemas/College'
                  match_scores:
                    type: array
                    items:
                      type: number
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forum/posts:
    get:
      tags:
        - Forum
      summary: Get forum posts
      description: Retrieve a list of forum posts with optional filtering
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: community_id
          in: query
          schema:
            type: integer
        - name: category
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, popular, trending]
            default: recent
      responses:
        '200':
          description: List of forum posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ForumPost'
    post:
      tags:
        - Forum
      summary: Create a new forum post
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumPost'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/forum/posts/{id}:
    get:
      tags:
        - Forum
      summary: Get forum post details
      description: Get details of a specific forum post (not in routes, but implied)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Forum post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForumPost'
        '404':
          description: Post not found
          content:
            application/json:
